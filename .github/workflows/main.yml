name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip3 install --user --upgrade buildozer cython virtualenv

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # Purani corrupt files ko saaf karne ke liye clean command
          buildozer android clean
          # Ab fresh build shuru karein
          yes | buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSE: y
          ACCEPT_NDK_LICENSE: y

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZARA-Jarvis-Stable-APK
          path: bin/*.apk
