name: Build ZARA APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Build Dependencies
        run: |
          sudo apt update
          # Yahan dhyan dein: Maine libtinfo5 ko puri tarah hata kar libtinfo6 kar diya hai
          # Aur baaki libraries ko bhi naye system ke hisaab se update kiya hai
          sudo apt install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev libsqlite3-dev lld
          
          # Buildozer aur Cython ka stable version install kar rahe hain
          pip3 install --user --upgrade buildozer cython==0.29.33 virtualenv

      - name: Build APK with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # 'yes' command ka pipe hata diya hai taaki 'Broken Pipe' error na aaye
          buildozer -v android debug
